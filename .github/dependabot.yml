version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # Security updates only: version update pull requests are disabled.
    open-pull-requests-limit: 0
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      # init and analyze must share one version, so update them in one pull request.
      codeql-action:
        patterns:
          - "github/codeql-action/*"
